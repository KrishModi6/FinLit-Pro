[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlit-pro-desktop"
version = "1.0.0"
description = "FinLit Pro: a personal desktop stock research workstation with the FinLit AI Predictor, Monte Carlo, options analysis, SEC EDGAR fundamentals and cited research notes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krish Modi" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "yfinance>=0.2.54",
    "keyring>=25",
    "anthropic>=1.16",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.6"]

[project.gui-scripts]
finlit-pro = "finlit_pro.__main__:main"

[tool.setuptools.packages.find]
include = ["finlit_pro*"]

[tool.setuptools.package-data]
finlit_pro = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# matplotlib still reads a Qt attribute that PySide6 has deprecated.
filterwarnings = ["ignore::DeprecationWarning:matplotlib.backends.backend_qt"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Long, readable f-strings beat wrapped ones; zip(strict=) is py310 noise here.
ignore = ["E501", "B905"]
