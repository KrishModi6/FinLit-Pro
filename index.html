<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Stock Guide: Learn the Stock Market, Beginner to Advanced (Free)</title>
    <meta
      name="description"
      content="A free, structured stock market course for students. Four tracks: Beginner (how stocks work), Intermediate (stable vs unstable stocks and safe portfolios), Examples (real five-year charts), and Hard (risk, options, and when a risky bet is worth it). Lessons, quizzes, and progress tracking."
    />
    <meta
      name="keywords"
      content="learn stocks, stock market course, investing for beginners, stable vs volatile stocks, options basics, portfolio diversification, student investing guide"
    />
    <meta name="author" content="Krish Modi" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.finlitpro.org/" />
    <meta name="theme-color" content="#0b111c" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stock Guide" />
    <meta property="og:title" content="Stock Guide: Learn the Stock Market, Beginner to Advanced" />
    <meta
      property="og:description"
      content="A free collection of structured, honest lessons to take you from your first share to understanding real risk."
    />
    <meta property="og:url" content="https://www.finlitpro.org/" />
    <meta property="og:image" content="https://www.finlitpro.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stock Guide: Learn the Stock Market, Free" />
    <meta name="twitter:description" content="Beginner, Intermediate and Hard tracks on how the stock market actually works." />
    <meta name="twitter:image" content="https://www.finlitpro.org/og-image.png" />

    <!-- Favicon: 📈 rendered as an inline SVG so there is no extra request -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "Stock Guide",
        "url": "https://www.finlitpro.org/",
        "description": "A free four-track stock market course covering market fundamentals, stable vs unstable stocks, real chart case studies, and high-risk investing.",
        "isAccessibleForFree": true,
        "educationalLevel": "Beginner to Advanced",
        "provider": { "@type": "Person", "name": "Krish Modi" }
      }
    </script>

    <!-- Set the theme before first paint so dark-mode users never see a white flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('stockguide:theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Vercel Web Analytics + Speed Insights (same as the previous deployment) -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) }
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
